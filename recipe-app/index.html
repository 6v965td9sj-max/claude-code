<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rezeptkartei</title>
  <meta name="theme-color" content="#f6f2ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rezepte">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <dialog id="paste-dialog">
    <form method="dialog">
      <h2>Rezept einfügen</h2>
      <p class="hint">Kompletten Text einfügen (z.&nbsp;B. von einer Webseite). Titel, Zutaten und Zubereitung werden automatisch erkannt – danach kannst du alles noch anpassen.</p>
      <textarea id="paste-text" rows="12" placeholder="Hier einfügen …"></textarea>
      <div class="row">
        <button type="button" id="paste-clipboard" class="secondary">Aus Zwischenablage</button>
        <span class="spacer"></span>
        <button value="cancel" class="secondary">Abbrechen</button>
        <button value="ok" id="paste-ok">Übernehmen</button>
      </div>
    </form>
  </dialog>
</body>
</html>
